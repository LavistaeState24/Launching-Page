<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavista Estate Launch</title>
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-black text-white">

    <section class="relative min-h-screen overflow-hidden px-4 py-12 sm:px-6 lg:px-8">

        <!-- Background Image -->
        <div class="absolute inset-0">
            <picture class="block h-full w-full">
                <source media="(max-width: 640px)"
                    srcset="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=900&auto=format&fit=crop" />
                <source media="(max-width: 1024px)"
                    srcset="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=1400&auto=format&fit=crop" />
                <img src="https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=1920&auto=format&fit=crop"
                    alt="Modern luxury estate interior" class="hero-image h-full w-full object-cover" />
            </picture>
            <div class="absolute inset-0 bg-black/55"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-black/35 via-black/15 to-black/45"></div>
        </div>

        <!-- Content -->
        <div class="relative z-10 mx-auto flex min-h-[calc(100vh-6rem)] max-w-6xl items-center justify-center">
            <div class="w-full text-center">

                <!-- Launch Badge -->
                <div
                    class="text-shadow-soft mb-5 flex items-center justify-center gap-2 text-xs text-white/80 sm:text-sm">
                    <i data-lucide="clock" class="h-4 w-4 text-[#b99b30]"></i>
                    <span class="uppercase tracking-[0.28em] sm:tracking-[0.34em]">Launching Soon</span>
                </div>

                <!-- Logo + Heading -->
                <div
                    class="mx-auto flex max-w-5xl flex-col items-center justify-center gap-3 sm:flex-row sm:gap-4 md:gap-5">

                    <img src="./assets/logo.png" alt="Lavista Logo"
                        class="h-14 w-auto object-contain sm:h-16 md:h-20 lg:h-24" />

                    <h1 class="gold-text text-3xl font-bold leading-tight sm:text-4xl md:text-5xl lg:text-6xl">
                        Lavista Estate
                    </h1>

                </div>

                <!-- Taglines -->
                <p
                    class="text-shadow-soft mx-auto mt-4 max-w-3xl text-base font-medium text-white/90 sm:text-lg md:mt-5 md:text-xl lg:text-3xl">
                    Your Trusted Property Partner in Ahmedabad
                </p>

                <p class="text-shadow-soft mx-auto mt-3 max-w-2xl text-sm leading-7 text-white/70 sm:text-base md:mt-4">
                    No Brokerage &bull; Direct Deal &bull; Transparent Pricing
                </p>

                <!-- Countdown -->
                <div class="mx-auto mt-8 grid max-w-5xl grid-cols-2 gap-4 sm:mt-10 sm:grid-cols-4 sm:gap-5 lg:mt-8">

                    <div
                        class="card-shadow rounded-2xl border border-[#b99b30]/25 bg-white/10 px-4 py-5 backdrop-blur-md sm:px-5 sm:py-6">
                        <i data-lucide="calendar" class="mx-auto mb-4 h-5 w-5 text-[#b99b30]"></i>
                        <p id="days" class="gold-text text-3xl font-bold sm:text-4xl md:text-5xl">00</p>
                        <span
                            class="mt-1 block text-[11px] uppercase tracking-[0.22em] text-white/65 sm:text-xs">Days</span>
                    </div>

                    <div
                        class="card-shadow rounded-2xl border border-[#b99b30]/25 bg-white/10 px-4 py-5 backdrop-blur-md sm:px-5 sm:py-6">
                        <i data-lucide="clock-3" class="mx-auto mb-4  h-5 w-5 text-[#b99b30]"></i>
                        <p id="hours" class="gold-text text-3xl font-bold sm:text-4xl md:text-5xl">00</p>
                        <span
                            class="mt-1 block text-[11px] uppercase tracking-[0.22em] text-white/65 sm:text-xs">Hours</span>
                    </div>

                    <div
                        class="card-shadow rounded-2xl border border-[#b99b30]/25 bg-white/10 px-4 py-5 backdrop-blur-md sm:px-5 sm:py-6">
                        <i data-lucide="timer" class="mx-auto mb-4 h-5 w-5 text-[#b99b30]"></i>
                        <p id="minutes" class="gold-text text-3xl font-bold sm:text-4xl md:text-5xl">00</p>
                        <span
                            class="mt-1 block text-[11px] uppercase tracking-[0.22em] text-white/65 sm:text-xs">Minutes</span>
                    </div>

                    <div
                        class="card-shadow rounded-2xl border border-[#b99b30]/25 bg-white/10 px-4 py-5 backdrop-blur-md sm:px-5 sm:py-6">
                        <i data-lucide="zap" class="mx-auto mb-4  h-5 w-5 text-[#b99b30]"></i>
                        <p id="seconds" class="gold-text text-3xl font-bold sm:text-4xl md:text-5xl">00</p>
                        <span
                            class="mt-1 block text-[11px] uppercase tracking-[0.22em] text-white/65 sm:text-xs">Seconds</span>
                    </div>

                </div>

                <!-- CTA -->
                <div class="mt-8 sm:mt-10">
                    <a href="https://wa.me/919213684966?text=Hi%20Lavista%20Estate%2C%20I%20am%20interested%20in%20upcoming%20projects.%20Please%20share%20details."
                        target="_blank" rel="noopener noreferrer"
                        class="inline-flex items-center justify-center gap-2 rounded-full bg-[#b99b30] px-6 py-3 text-sm font-semibold text-black transition hover:bg-[#d4b73f] sm:px-8 sm:py-3.5 sm:text-base">
                        <i data-lucide="message-circle" class="h-5 w-5"></i>
                        Get Early Access on WhatsApp
                    </a>
                </div>

            </div>
        </div>
    </section>

    <script src="./script.js"></script>

</body>

</html>
